name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: farm_ci
          POSTGRES_PASSWORD: farm_ci
          POSTGRES_DB: postgres
          TZ: Africa/Nairobi
          PGTZ: Africa/Nairobi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: farm_ci
      DB_PASSWORD: farm_ci
      # The backend's jest global setup drops, recreates and migrates this database
      TEST_DB_NAME: farm_management_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Backend tests (coverage gate 60%)
        run: npm run test:ci -w packages/backend

      - name: Frontend tests (coverage gate 60%)
        run: npm run test:coverage -w packages/frontend

      - name: Frontend build
        run: npm run build

          in: query
          schema: { $ref: '#/components/schemas/ReferenceType' }
      responses:
        '200': { $ref: '#/components/responses/PagedList' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Inventory]
      operationId: createInventoryTransaction
      summary: Record a stock movement
      description: |
        Quantities are magnitudes: purchases and returns add to stock, the other
        types take from it, except `adjustment`, whose quantity is signed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [item_id, transaction_type, quantity]
                  properties:
                    item_id: { type: integer }
                    transaction_type: { $ref: '#/components/schemas/TransactionType' }
                    quantity: { type: number, description: Greater than zero unless an adjustment }
                    unit_cost: { type: [number, 'null'], minimum: 0 }
                    total_cost: { type: [number, 'null'], minimum: 0 }
                - $ref: '#/components/schemas/MovementDetails'
      responses:
        '201': { $ref: '#/components/responses/RecordCreated' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

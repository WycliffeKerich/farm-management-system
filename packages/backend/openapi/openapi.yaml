  /audit-log:
    get:
      tags: [Audit log]
      operationId: listAuditLog
      summary: Changes to business records (paged)
      description: Owner only. Newest first unless `order=asc`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Order'

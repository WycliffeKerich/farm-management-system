openapi: 3.1.0
info:
  title: Farm Management System API
  version: 1.0.0
  description: |
    The REST API behind the farm management web app.

    Every response is JSON in an envelope: `{ success: true, data, message? }` on
    success and `{ success: false, error: { code, message, details? } }` on failure.
    Paged lists add `pagination: { page, limit, total, totalPages }` beside `data`.

    Sign in with `POST /auth/login`. It returns a short-lived access token, sent as
    `Authorization: Bearer <token>`, and sets the refresh token as an httpOnly
    cookie (`rt`) that `POST /auth/refresh` exchanges for a new pair.

    This spec covers health, auth, users, inventory, suppliers, withdrawals,
    activities, enterprises, the audit log, attachments and settings. Crops and
    animals are added in Phase 10; every new endpoint goes in here as it is built.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: This server
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Whether the API is up
  - name: Auth
    description: Sign-in, sessions, and the signed-in user's own account
  - name: Users
    description: Accounts, managed by the owner
  - name: Inventory
    description: Items, stock movements, units, batches and reports
  - name: Suppliers
    description: Where stock is bought from
  - name: Withdrawals
    description: Pre-harvest intervals and withdrawal periods in force
  - name: Activities
    description: The farm timeline and offline sync
  - name: Enterprises
    description: Lines of business costed on their own
  - name: Audit log
    description: Who changed what (owner only)
  - name: Attachments
    description: Photos and documents on records
  - name: Settings
    description: Farm-wide settings

paths:
  # ==================== HEALTH ====================
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Whether the API and its database are up
      security: []
      responses:
        '200':
          description: Up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: The database cannot be reached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  # ==================== AUTH ====================
  /auth/bootstrap:
    get:
      tags: [Auth]
      operationId: getBootstrapStatus
      summary: Whether the first owner account still needs creating
      security: []
      responses:
        '200':
          description: Setup status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [needsSetup]
                        properties:
                          needsSetup: { type: boolean }
    post:
      tags: [Auth]
      operationId: bootstrapOwner
      summary: Create the first owner account
      description: Only while no users exist. Rate limited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, first_name, last_name]
              properties:
                email: { type: string, format: email, maxLength: 255 }
                password: { $ref: '#/components/schemas/NewPassword' }
                first_name: { type: string, maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                phone: { type: [string, 'null'], maxLength: 20 }
      responses:
        '201':
          description: Owner created; log in next
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in
      description: Returns an access token and sets the `rt` refresh cookie. Rate limited; repeated failures lock the account for a while.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, maxLength: 1024 }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: Wrong email or password, or the account is locked (`ACCOUNT_LOCKED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Exchange the refresh cookie for a new access token
      description: The cookie is rotated on every use; presenting a used one revokes the whole session family.
      security:
        - refreshCookie: []
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End this session
      security:
        - refreshCookie: []
        - {}
      responses:
        '200': { $ref: '#/components/responses/Message' }

  /auth/logout-all:
    post:
      tags: [Auth]
      operationId: logoutAll
      summary: End every session of the signed-in user
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Email a password reset link
      description: Always answers 200, whether or not the email has an account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with a reset token
      description: Signs the user out everywhere and clears any lockout.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, maxLength: 200 }
                password: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: The signed-in user
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Auth]
      operationId: updateMe
      summary: Change the signed-in user's name or phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string, maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                phone: { type: [string, 'null'], maxLength: 20 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/change-password:
    put:
      tags: [Auth]
      operationId: changePassword
      summary: Change the signed-in user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, confirmPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { $ref: '#/components/schemas/NewPassword' }
                confirmPassword: { type: string, description: Must equal newPassword }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ==================== USERS ====================
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      description: Owner only. Active users first, then by name.
      parameters:
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: is_active
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user
      description: Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, first_name, last_name, role]
              properties:
                email: { type: string, format: email, maxLength: 255 }
                password: { $ref: '#/components/schemas/NewPassword' }
                first_name: { type: string, maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                role: { $ref: '#/components/schemas/Role' }
                phone: { type: [string, 'null'], maxLength: 20 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Users]
      operationId: getUser
      summary: A user with their active sessions
      description: Owner only.
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/User'
                          - type: object
                            properties:
                              locked_until: { type: [string, 'null'], format: date-time }
                              sessions:
                                type: array
                                items: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Users]
      operationId: updateUser
      summary: Change a user
      description: Owner only. The last active owner cannot be demoted or deactivated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, maxLength: 255 }
                first_name: { type: string, maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                role: { $ref: '#/components/schemas/Role' }
                is_active: { type: boolean }
                phone: { type: [string, 'null'], maxLength: 20 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{id}/password:
    put:
      tags: [Users]
      operationId: setUserPassword
      summary: Set a user's password
      description: Owner only. Signs the user out everywhere.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{id}/sessions:
    delete:
      tags: [Users]
      operationId: revokeUserSessions
      summary: Sign a user out of every device
      description: Owner only.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Sessions revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          revoked: { type: integer, description: Number of sessions ended }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================== INVENTORY ====================
  /inventory/summary:
    get:
      tags: [Inventory]
      operationId: getInventorySummary
      summary: Stock counts and value at a glance
      responses:
        '200': { $ref: '#/components/responses/RecordResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /inventory/low-stock:
    get:
      tags: [Inventory]
      operationId: getLowStockItems
      summary: Items at or below their minimum stock
      responses:
        '200': { $ref: '#/components/responses/RecordList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /inventory/expiring:
    get:
      tags: [Inventory]
      operationId: getExpiringItems
      summary: Items expiring within some days
      parameters:
        - $ref: '#/components/parameters/Days'
      responses:
        '200': { $ref: '#/components/responses/RecordList' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /inventory/reports/valuation:
    get:
      tags: [Inventory]
      operationId: getValuationReport
      summary: Stock value by item and category
      description: Owners and managers.
      parameters:
        - name: category_id
          in: query
          schema: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/RecordResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /inventory/reports/reorder:
    get:
      tags: [Inventory]
      operationId: getReorderReport
      summary: What to reorder, from recent usage
      description: Owners and managers.
      parameters:
        - name: usage_days
          in: query
          description: Days of usage to average over
          schema: { type: integer, minimum: 7, maximum: 365 }
      responses:
        '200': { $ref: '#/components/responses/RecordResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /inventory/reports/expiring:
    get:
      tags: [Inventory]
      operationId: getExpiringReport
      summary: Stock expiring soon, with its value
      description: Owners and managers.
      parameters:
        - $ref: '#/components/parameters/Days'
      responses:
        '200': { $ref: '#/components/responses/RecordResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /inventory/categories:
    get:
      tags: [Inventory]
      operationId: listInventoryCategories
      summary: List inventory categories
      responses:
        '200': { $ref: '#/components/responses/RecordList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Inventory]
      operationId: createInventoryCategory
      summary: Create a category
      description: Owners and managers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                description: { type: [string, 'null'] }
      responses:
        '201': { $ref: '#/components/responses/RecordCreated' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /inventory/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Inventory]
      operationId: getInventoryCategory
      summary: A category
      responses:
        '200': { $ref: '#/components/responses/RecordResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Inventory]
      operationId: updateInventoryCategory
      summary: Change a category
      description: Owners and managers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                description: { type: [string, 'null'] }
      responses:
        '200': { $ref: '#/components/responses/RecordResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Inventory]
      operationId: deleteInventoryCategory
      summary: Delete a category
      description: Owners and managers. Refused while items use it.
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /inventory/items:
    get:
      tags: [Inventory]
      operationId: listInventoryItems
      summary: List items
      description: Paged when `page` or `limit` is given; otherwise every matching item.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: category_id
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/Search'
        - name: low_stock
          in: query
          schema: { type: boolean }
        - name: stock_status
          in: query
          schema: { type: string, enum: [low, out, ok] }
        - name: expiring_days
          in: query
          schema: { type: integer, minimum: 1 }
        - name: sort
          in: query
          description: Column to sort by
          schema: { type: string, pattern: '^[a-z_]+$' }
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Items, paged or not
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PagedRecords'
                  - $ref: '#/components/schemas/RecordListEnvelope'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Inventory]
      operationId: createInventoryItem
      summary: Create an item
      description: Owners and managers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [name, category_id, unit]
                  properties:
                    current_stock: { type: number, minimum: 0 }
                - $ref: '#/components/schemas/InventoryItemInput'
      responses:
        '201': { $ref: '#/components/responses/RecordCreated' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /inventory/items/code/{code}:
    get:
      tags: [Inventory]
      operationId: getInventoryItemByCode
      summary: An item by its item code
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/RecordResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /inventory/items/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Inventory]
      operationId: getInventoryItem
      summary: An item
      responses:
        '200': { $ref: '#/components/responses/RecordResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Inventory]
      operationId: updateInventoryItem
      summary: Change an item
      description: Owners and managers. Stock changes go through transactions, not here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryItemInput' }
      responses:
        '200': { $ref: '#/components/responses/RecordResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Inventory]
      operationId: deleteInventoryItem
      summary: Delete an item
      description: Owners and managers.
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /inventory/items/{id}/transactions:
    get:
      tags: [Inventory]
      operationId: listInventoryItemTransactions
      summary: An item's stock movements
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: transaction_type
          in: query
          schema: { $ref: '#/components/schemas/TransactionType' }
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200': { $ref: '#/components/responses/RecordList' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /inventory/items/{id}/usage-report:
    get:
      tags: [Inventory]
      operationId: getInventoryItemUsageReport
      summary: How much of an item was used between two dates
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: date_from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: date_to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/RecordResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /inventory/items/{id}/use:
    post:
      tags: [Inventory]
      operationId: useInventoryStock
      summary: Record stock used
      description: Takes from the batch given, or first-expiring first.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [quantity]
                  properties:
                    quantity: { type: number, exclusiveMinimum: 0 }
                - $ref: '#/components/schemas/MovementDetails'
      responses:
        '201': { $ref: '#/components/responses/RecordCreated' }
        '400': { $ref: '#/components/responses/ValidationFailed' }

  # ==================== WITHDRAWALS ====================
  /withdrawals/active:
    get:
      tags: [Withdrawals]
      operationId: getActiveWithdrawals
      summary: What cannot be harvested or used on a date
      description: |
        Crop batches inside a pre-harvest interval, and animals or groups whose
        milk, meat or eggs are inside a withdrawal period, each with its latest
        safe-from date and the applications behind it.
      parameters:
        - name: date
          in: query
          description: Defaults to today
          schema: { type: string, format: date }
      responses:
        '200':
          description: Holds in force
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [date, crops, animals]
                        properties:
                          date: { type: string, format: date }
                          crops:
                            type: array
                            items: { $ref: '#/components/schemas/Record' }
                          animals:
                            type: array
                            items: { $ref: '#/components/schemas/Record' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ==================== ACTIVITIES ====================
  /activities:
    get:
      tags: [Activities]
      operationId: listActivities
      summary: The farm timeline (paged)
      description: Newest first by default. Each activity carries the detail row behind it, when it has one.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          schema: { type: string, enum: [date, activity_type, title, status, created_at], default: date }
        - $ref: '#/components/parameters/Order'
        - name: enterprise_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: crop_batch_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: animal_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: animal_group_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: performed_by
          in: query
          description: Employee ID
          schema: { type: integer, minimum: 1 }
        - name: task_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ActivityStatus' }
        - name: activity_type
          in: query
          description: One type, or several as `activity_type=a&activity_type=b`
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/ActivityType' }
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - name: search
          in: query
          description: Matches the title and notes
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: A page of activities
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - $ref: '#/components/schemas/PaginationEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /activities/bulk:
    post:
      tags: [Activities]
      operationId: recordActivitiesBulk
      summary: Record many activities at once (offline sync)
      description: |
        Each entry is saved on its own: one that fails does not stop the rest.
        `client_request_id` makes a replay safe; an entry already saved comes back
        as `duplicate` with its activity. `data` is the body the single-record
        endpoint of that kind takes, and `batch_id` the crop batch for crop kinds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [client_request_id, kind, data]
                    properties:
                      client_request_id:
                        type: string
                        format: uuid
                        description: Unique within the request and across replays
                      kind:
                        type: string
                        enum:
                          [observation, harvest, input_application, pest_incident, feeding, health_record, treatment, production]
                      batch_id: { type: [integer, 'null'], minimum: 1 }
                      data: { type: object }
      responses:
        '200':
          description: One result per entry, in order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          required: [client_request_id, status]
                          properties:
                            client_request_id: { type: string, format: uuid }
                            status: { type: string, enum: [created, duplicate, failed] }
                            activity_id: { type: integer }
                            record: { $ref: '#/components/schemas/Record' }
                            error: { $ref: '#/components/schemas/ErrorBody' }
                      summary:
                        type: object
                        properties:
                          created: { type: integer }
                          duplicate: { type: integer }
                          failed: { type: integer }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /activities/{id}:
    get:
      tags: [Activities]
      operationId: getActivity
      summary: An activity with its detail row
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The activity
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }


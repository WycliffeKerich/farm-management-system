          in: query
          schema: { type: string, pattern: '^[a-z_]{1,63}$' }
        - name: record_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: changed_by
          in: query
          description: User ID
          schema: { type: integer, minimum: 1 }
        - name: action
          in: query
          description: One action, or several as `action=a&action=b`
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, enum: [insert, update, delete, soft_delete] }
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: A page of changes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - $ref: '#/components/schemas/PaginationEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AuditEntry' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ==================== ATTACHMENTS ====================
  /attachments:
    get:
      tags: [Attachments]
      operationId: listAttachments
      summary: A record's attachments, newest first (paged)
      description: Finance records' attachments are for owners and managers.
      parameters:
        - name: entity_type
          in: query
          required: true
          schema: { $ref: '#/components/schemas/AttachmentEntityType' }
        - name: entity_id
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of attachments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - $ref: '#/components/schemas/PaginationEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Attachments]
      operationId: uploadAttachment
      summary: Attach a file to a record
      description: |
        JPEG, PNG, WebP or PDF, checked by content (anything else is a 400), up to
        `UPLOAD_MAX_MB` (default 10).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, entity_type, entity_id]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                entity_type: { $ref: '#/components/schemas/AttachmentEntityType' }
                entity_id: { type: integer, minimum: 1 }
                caption: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: The file is too large (`FILE_TOO_LARGE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /attachments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Attachments]
      operationId: downloadAttachment
      summary: The file itself
      description: Shown inline, or saved with `download=true`.
      parameters:
        - name: download
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: The file
          content:
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
            image/png:
              schema: { type: string, contentMediaType: image/png }
            image/webp:
              schema: { type: string, contentMediaType: image/webp }
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Attachments]
      operationId: updateAttachment
      summary: Change the caption
      description: The uploader, owners and managers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                caption: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Attachments]
      operationId: deleteAttachment
      summary: Remove an attachment
      description: The uploader, owners and managers.
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================== SETTINGS ====================
  /settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: The farm's settings, with defaults for any not saved
      responses:
        '200': { $ref: '#/components/responses/SettingsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Settings]
      operationId: updateSettings
      summary: Change some settings
      description: Owner only. All or nothing; each bad value is named in `error.details`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                farm_name: { type: string, minLength: 1, maxLength: 100 }
                currency: { type: string, pattern: '^[A-Za-z]{3}$', description: ISO 4217 code }
                timezone: { type: string, description: 'IANA time zone, e.g. Africa/Nairobi' }
                farm_location: { $ref: '#/components/schemas/FarmLocation' }
      responses:
        '200': { $ref: '#/components/responses/SettingsResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The access token from login or refresh
    refreshCookie:
      type: apiKey
      in: cookie
      name: rt
      description: httpOnly refresh token, scoped to /api/v1/auth

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Order:
      name: order
      in: query
      schema: { type: string, enum: [asc, desc] }
    Search:
      name: search
      in: query
      schema: { type: string, maxLength: 100 }
    DateFrom:
      name: date_from
      in: query
      schema: { type: string, format: date }
    DateTo:
      name: date_to
      in: query
      schema: { type: string, format: date }
    Days:
      name: days
      in: query
      schema: { type: integer, minimum: 1, maximum: 365 }

  responses:
    Message:
      description: Done
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Success' }
    Session:
      description: Signed in; the `rt` cookie is set
      headers:
        Set-Cookie:
          description: The rotated refresh token (`rt`, httpOnly, SameSite=Strict, path /api/v1/auth)
          schema: { type: string }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    type: object
                    required: [user, accessToken]
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      accessToken: { type: string }
    RecordResponse:
      description: The record
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RecordEnvelope' }
    RecordCreated:
      description: Created
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RecordEnvelope' }
    RecordList:
      description: The records
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RecordListEnvelope' }
    PagedList:
      description: A page of records
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PagedRecords' }
    SettingsResponse:
      description: Every setting
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Settings' }
    ValidationFailed:
      description: The request is invalid; `error.details` names each field
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Not signed in, or the token has expired
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Signed in, but this role may not do this
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such record
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Clashes with an existing record, or the record is in use
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limited; try again later
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Success:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: e.g. VALIDATION_ERROR, NOT_FOUND, DUPLICATE, IN_USE
        message: { type: string }
        details:
          description: For validation errors, one `{ field, message }` per problem
          oneOf:
            - type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
            - type: object
    Error:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error: { $ref: '#/components/schemas/ErrorBody' }
    Pagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    PaginationEnvelope:
      type: object
      required: [pagination]
      properties:
        pagination: { $ref: '#/components/schemas/Pagination' }
    Record:
      type: object
      description: A database row; its columns are not yet described here
      additionalProperties: true
    RecordEnvelope:
      allOf:
        - $ref: '#/components/schemas/Success'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Record' }
    RecordListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Success'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Record' }
    PagedRecords:
      allOf:
        - $ref: '#/components/schemas/Success'
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Record' }
    Health:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        database: { type: string, enum: [up, down] }
        timestamp: { type: string, format: date-time }

    Role:
      type: string
      enum: [owner, manager, worker]
    NewPassword:
      type: string
      minLength: 10
      maxLength: 72
    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        phone: { type: [string, 'null'] }
        is_active: { type: boolean }
        last_login: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserResponse:
      allOf:
        - $ref: '#/components/schemas/Success'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/User' }

    TransactionType:
      type: string
      enum: [purchase, usage, adjustment, return, expired, transfer, waste]
    ReferenceType:
      type: string
      enum: [crop_batch, animal, animal_group, task, manual]
    BatchStatus:
      type: string
      enum: [active, depleted, expired, quarantine, disposed]
    InventoryItemInput:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        category_id: { type: integer }
        unit: { type: string, maxLength: 50 }
        minimum_stock: { type: [number, 'null'], minimum: 0 }
        reorder_quantity: { type: [number, 'null'], minimum: 0 }
        cost_per_unit: { type: [number, 'null'], minimum: 0 }
        supplier: { type: [string, 'null'], maxLength: 200 }
        default_supplier_id: { type: [integer, 'null'] }
        location: { type: [string, 'null'], maxLength: 200 }
        expiry_date: { type: [string, 'null'], format: date }
        active_ingredient: { type: [string, 'null'], maxLength: 255 }
        pre_harvest_interval_days: { $ref: '#/components/schemas/SafetyDays' }
        milk_withdrawal_days: { $ref: '#/components/schemas/SafetyDays' }
        meat_withdrawal_days: { $ref: '#/components/schemas/SafetyDays' }
        egg_withdrawal_days: { $ref: '#/components/schemas/SafetyDays' }
        notes: { type: [string, 'null'] }
    SafetyDays:
      type: [integer, 'null']
      minimum: 0
      maximum: 3650
    MovementDetails:
      type: object
      properties:
        unit:
          type: string
          maxLength: 50
          description: The unit the quantity is in, if not the item's own
        inventory_batch_id: { type: [integer, 'null'] }
        reference_type: { $ref: '#/components/schemas/ReferenceType' }
        reference_id: { type: [integer, 'null'] }
        transaction_date: { type: [string, 'null'], format: date }
        notes: { type: [string, 'null'] }
    UnitInput:
      type: object
      properties:
        name: { type: string, maxLength: 50 }
        symbol: { type: string, maxLength: 20 }
        category: { type: string, enum: [weight, volume, length, area, count, time, other] }
        base_unit_id: { type: [integer, 'null'] }
        conversion_factor: { type: [number, 'null'], minimum: 0 }
        description: { type: [string, 'null'] }
    BatchDetails:
      type: object
      properties:
        batch_number: { type: [string, 'null'], maxLength: 100 }
        unit_cost: { type: [number, 'null'], minimum: 0 }
        manufacture_date: { type: [string, 'null'], format: date }
        expiry_date: { type: [string, 'null'], format: date }
        supplier: { type: [string, 'null'], maxLength: 255 }
        supplier_id: { type: [integer, 'null'] }
        supplier_batch_number: { type: [string, 'null'], maxLength: 100 }
        storage_location: { type: [string, 'null'], maxLength: 200 }
        notes: { type: [string, 'null'] }
    SupplierInput:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        contact_person: { type: [string, 'null'], maxLength: 255 }
        phone: { type: [string, 'null'], maxLength: 50 }
        email: { type: [string, 'null'], format: email, maxLength: 255 }
        kra_pin: { type: [string, 'null'], maxLength: 20 }
        address: { type: [string, 'null'], maxLength: 1000 }
        notes: { type: [string, 'null'], maxLength: 5000 }
        is_active: { type: boolean }

    ActivityType:
      type: string
      enum:
        - input_application
        - observation
        - harvest
        - pest_incident
        - feeding
        - vaccination
        - deworming
        - health_check
        - treatment
        - production
        - task_work
    ActivityStatus:
      type: string
      enum: [planned, done, cancelled]
    Activity:
      type: object
      description: |
        One thing done (or planned) on the farm. It has one subject at most, a
        crop batch, an animal or a group; only task work may have none.
      properties:
        id: { type: integer }
        activity_type: { $ref: '#/components/schemas/ActivityType' }
        status: { $ref: '#/components/schemas/ActivityStatus' }
        title: { type: string, maxLength: 255 }
        planned_for: { type: [string, 'null'], format: date }
        occurred_on: { type: [string, 'null'], format: date }
        enterprise_id: { type: [integer, 'null'] }
        location_id: { type: [integer, 'null'] }
        crop_batch_id: { type: [integer, 'null'] }
        animal_id: { type: [integer, 'null'] }
        animal_group_id: { type: [integer, 'null'] }
        performed_by: { type: [integer, 'null'], description: Employee ID }
        recorded_by: { type: [integer, 'null'], description: User ID }
        labour_hours: { type: [string, 'null'], description: Decimal as a string }
        input_cost: { type: [string, 'null'], description: Decimal as a string }
        other_cost: { type: [string, 'null'], description: Decimal as a string }
        task_id: { type: [integer, 'null'] }
        client_request_id: { type: [string, 'null'], format: uuid }
        notes: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: true

    EnterpriseType:
      type: string
      enum: [crops, mushrooms, poultry, dairy, livestock, apiculture, aquaculture, other]
    EnterpriseInput:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        enterprise_type: { $ref: '#/components/schemas/EnterpriseType' }
        unit_of_output: { type: [string, 'null'], maxLength: 20, description: 'e.g. kg, egg, litre' }
        description: { type: [string, 'null'], maxLength: 5000 }
        is_active: { type: boolean }
    Enterprise:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        enterprise_type: { $ref: '#/components/schemas/EnterpriseType' }
        unit_of_output: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: true
    EnterpriseResponse:
      allOf:
        - $ref: '#/components/schemas/Success'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Enterprise' }

    AuditEntry:
      type: object
      properties:
        id: { type: integer }
        table_name: { type: string }
        record_id: { type: [integer, 'null'] }
        action: { type: string, enum: [insert, update, delete, soft_delete] }
        changed_by: { type: [integer, 'null'], description: User ID }
        changed_at: { type: string, format: date-time }
        before: { type: [object, 'null'], description: The row before; secrets left out }
        after: { type: [object, 'null'], description: The row after; secrets left out }
      additionalProperties: true

    AttachmentEntityType:
      type: string
      enum:
        - activities
        - animal_diseases_treatments
        - animal_health_records
        - crop_pests_diseases
        - financial_transactions
        - growth_observations
        - inventory_transactions
    Attachment:
      type: object
      properties:
        id: { type: integer }
        entity_type: { $ref: '#/components/schemas/AttachmentEntityType' }
        entity_id: { type: integer }
        file_name: { type: string }
        mime_type: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
        size_bytes: { type: integer }
        caption: { type: [string, 'null'] }
        uploaded_by: { type: [integer, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: true
    AttachmentResponse:
      allOf:
        - $ref: '#/components/schemas/Success'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Attachment' }

    FarmLocation:
      type: [object, 'null']
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    Settings:
      type: object
      required: [farm_name, currency, timezone, farm_location]
      properties:
        farm_name: { type: string }
        currency: { type: string, description: 'ISO 4217 code, e.g. KES' }
        timezone: { type: string, description: IANA time zone }
        farm_location: { $ref: '#/components/schemas/FarmLocation' }
